name: Ubuntu

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '*.rst'
      - 'UNLICENCE'
      - 'Doxyfile.in'
      - 'images/**'
      - 'shaders/**'
  pull_request:
    paths-ignore:
      - '*.rst'
      - 'UNLICENCE'
      - 'Doxyfile.in'
      - 'images/**'
      - 'shaders/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Ubuntu Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build python3-pip libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
        python3 -m pip install --user "Jinja2>=2.7,<4.0"

    - name: Generate
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
      run: cmake -S"${{ github.workspace }}" -B"${{ github.workspace }}/build" -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

    - name: Build
      run: cmake --build "${{ github.workspace }}/build" --config ${{ matrix.build_type }}
