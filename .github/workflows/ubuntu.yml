name: Ubuntu

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Ubuntu Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build python3-venv libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
        python3 -m venv "${RUNNER_TEMP}/glad-venv"
        "${RUNNER_TEMP}/glad-venv/bin/python" -m pip install --upgrade pip
        "${RUNNER_TEMP}/glad-venv/bin/python" -m pip install "Jinja2>=2.7,<4.0"

    - name: Generate
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
      run: cmake -S"${{ github.workspace }}" -B"${{ github.workspace }}/build" -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPython_EXECUTABLE="${RUNNER_TEMP}/glad-venv/bin/python" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

    - name: Build
      run: |
        set -o pipefail
        cmake --build "${{ github.workspace }}/build" --config ${{ matrix.build_type }} -- -k 0 2>&1 | tee "build-${{ matrix.build_type }}-${{ matrix.compiler.cc }}.log"

    - name: Test
      run: ctest --test-dir "${{ github.workspace }}/build" --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Upload failed build log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ubuntu-${{ matrix.build_type }}-${{ matrix.compiler.cc }}-build-log
        path: build-${{ matrix.build_type }}-${{ matrix.compiler.cc }}.log
        if-no-files-found: ignore
